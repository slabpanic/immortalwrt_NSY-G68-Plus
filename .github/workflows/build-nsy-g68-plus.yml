name: Build NSY G68-Plus Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  schedule:
    - cron: '0 18 * * 5'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    name: rockchip/armv8 - nsy_g68-plus

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            build-essential ccache clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev libelf-dev \
            python3 python3-setuptools python3-dev python3-pyelftools \
            rsync swig time unzip zlib1g-dev file wget

      - name: Configure target
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_nsy_g68-plus=y
          CONFIG_TARGET_BOARD="rockchip"
          CONFIG_TARGET_SUBTARGET="armv8"
          CONFIG_TARGET_PROFILE="DEVICE_nsy_g68-plus"

          # Bootloader / firmware (required to assemble the rockchip image)
          CONFIG_PACKAGE_trusted-firmware-a-rk3568=y
          CONFIG_PACKAGE_u-boot-nsy-g68-plus-rk3568=y

          # Web UI
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y

          # Keep per-package build logs for failure diagnostics
          CONFIG_BUILD_LOG=y
          EOF

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Expand configuration
        run: |
          make defconfig
          echo "=== Selected device ==="
          grep -E 'CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE)|DEVICE_nsy_g68-plus' .config

      - name: Download sources
        run: make -j"$(nproc)" download

      - name: Build firmware
        run: make -j"$(nproc)" || make -j1 V=s

      - name: Dump build logs on failure
        if: failure()
        run: |
          echo "=== error.txt files ==="
          find logs -name 'error.txt' -print -exec cat {} \; 2>/dev/null || true
          echo "=== target logs (tail) ==="
          for f in $(find logs -path '*target*' -name '*.txt' 2>/dev/null); do
            echo "===== $f ====="
            tail -n 120 "$f"
          done

      - name: Collect firmware
        run: |
          mkdir -p out
          find bin/targets/rockchip/armv8 -maxdepth 1 -type f -exec cp -v {} out/ \;
          (cd out && sha256sum ./* > sha256sums.txt)
          ls -lh out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-rockchip-armv8-nsy_g68-plus
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Generate release tag
        id: tag
        run: echo "name=$(date +%Y.%m.%d)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: NSY G68-Plus ${{ steps.tag.outputs.name }}
          body: |
            Automated ImmortalWrt build for **NSY G68-Plus** (Rockchip RK3568).

            - Target: `rockchip/armv8`
            - Device: `nsy_g68-plus`
            - Source: ${{ github.sha }}
          files: out/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
